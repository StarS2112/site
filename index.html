<style>

  :root{
    --bg: #131118;
    --surface: #1E1B26;
    --primary: #A88FFF;
    --on-surface: #F1ECFA;
    --on-surface-dim: #948EA3;
    --accent: #D8FF3D;
    --outline: #322C3D;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--on-surface);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    position: relative;
    overflow-x: hidden;
  }

  #net{
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  .card{
    width: 100%;
    max-width: 480px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .avatar{
    width: 88px; height: 88px;
    margin: 0 auto 22px;
    border-radius: 32% 68% 65% 35% / 40% 35% 65% 60%;
    background: linear-gradient(135deg, var(--primary), var(--accent) 140%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size: 1.6rem; color:#fff;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
  }

  .tagline{
    margin-top: 6px;
    color: var(--on-surface-dim);
    font-size: 0.95rem;
  }

  .status{
    display:inline-flex; align-items:center; gap:7px;
    margin-top: 14px;
    font-size: 0.78rem; font-weight:600;
    color: var(--on-surface-dim);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(216,255,61,0.35);
  }

  .icons{
    display:flex; justify-content:center; gap: 14px;
    margin-top: 30px;
  }
  .icons a{
    width: 46px; height: 46px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 50%;
    color: var(--on-surface);
    transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .icons a svg{ width:19px; height:19px; }
  .icons a:hover{
    background: var(--primary);
    color: #fff;
    transform: translateY(-2px);
  }

  .specs{
    margin-top: 44px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 20px 20px 20px 6px;
    padding: 22px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.9;
  }
  .specs .head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--outline);
  }
  .specs .head span:first-child{
    font-weight:600; color: var(--on-surface);
    text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem;
  }
  .specs .head span:last-child{ color: var(--on-surface-dim); font-size: 0.75rem; }

  .row{ display:flex; justify-content:space-between; gap: 12px; }
  .row .k{ color: var(--on-surface-dim); }
  .row .v{ color: var(--on-surface); font-weight: 600; text-align: right; }

  footer{
    margin-top: 40px;
    font-size: 0.78rem;
    color: var(--on-surface-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  :focus-visible{ outline: 2px solid var(--primary); outline-offset: 3px; }

  @media (max-width: 420px){
    .row{ flex-direction: column; gap: 2px; }
    .row .v{ text-align: left; }
  }
</style>
</head>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, particles;
  var mouse = { x: null, y: null, active: false };

  var LINE_COLOR = '148, 142, 163';   // matches --on-surface-dim
  var MOUSE_LINE_COLOR = '168, 143, 255'; // matches --primary
  var MAX_DIST = 130;
  var MOUSE_DIST = 170;

  function size(){
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeParticles(){
    var count = Math.round((w * h) / 16000);
    count = Math.max(40, Math.min(count, 110));
    particles = [];
    for (var i = 0; i < count; i++){
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.4 + 0.8
      });
    }
  }

  function step(){
    ctx.clearRect(0, 0, w, h);

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + LINE_COLOR + ', 0.55)';
      ctx.fill();

      for (var j = i + 1; j < particles.length; j++){
        var q = particles[j];
        var dx = p.x - q.x, dy = p.y - q.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST){
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = 'rgba(' + LINE_COLOR + ', ' + (1 - dist / MAX_DIST) * 0.35 + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      if (mouse.active){
        var mdx = p.x - mouse.x, mdy = p.y - mouse.y;
        var mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mdist < MOUSE_DIST){
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = 'rgba(' + MOUSE_LINE_COLOR + ', ' + (1 - mdist / MOUSE_DIST) * 0.6 + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    if (mouse.active){
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + MOUSE_LINE_COLOR + ', 0.9)';
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('resize', function(){
    size();
    makeParticles();
    if (reduceMotion) step();
  });

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
  });
  window.addEventListener('touchmove', function(e){
    if (e.touches && e.touches[0]){
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, { passive: true });
  window.addEventListener('touchend', function(){
    mouse.active = false;
  });

  size();
  makeParticles();
  step();
})();
</script>
