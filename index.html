<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, particles;
  var mouse = { x: null, y: null, active: false };

  var LINE_COLOR = '169, 142, 128';   // matches --on-surface-dim
  var MOUSE_LINE_COLOR = '198, 90, 76'; // matches --primary
  var MAX_DIST = 130;
  var MOUSE_DIST = 240;

  function size(){
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeParticles(){
    var count = Math.round((w * h) / 16000);
    count = Math.max(40, Math.min(count, 110));
    particles = [];
    for (var i = 0; i < count; i++){
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.4 + 0.8
      });
    }
  }

  function step(){
    ctx.clearRect(0, 0, w, h);

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + LINE_COLOR + ', 0.55)';
      ctx.fill();

      for (var j = i + 1; j < particles.length; j++){
        var q = particles[j];
        var dx = p.x - q.x, dy = p.y - q.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MAX_DIST){
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = 'rgba(' + LINE_COLOR + ', ' + (1 - dist / MAX_DIST) * 0.35 + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      if (mouse.active){
        var mdx = p.x - mouse.x, mdy = p.y - mouse.y;
        var mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mdist < MOUSE_DIST){
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = 'rgba(' + MOUSE_LINE_COLOR + ', ' + (1 - mdist / MOUSE_DIST) * 0.9 + ')';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    if (mouse.active){
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + MOUSE_LINE_COLOR + ', 1)';
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('resize', function(){
    size();
    makeParticles();
    if (reduceMotion) step();
  });

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
  });
  window.addEventListener('touchmove', function(e){
    if (e.touches && e.touches[0]){
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, { passive: true });
  window.addEventListener('touchend', function(){
    mouse.active = false;
  });

  size();
  makeParticles();
  step();
})();
</script>
